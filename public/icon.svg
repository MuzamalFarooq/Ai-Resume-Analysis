<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Resume Document Graphic -->
  <g filter="url(#shadow)">
    <!-- Document Body -->
    <path d="M 140 90 L 300 90 L 370 160 L 370 410 C 370 426.5 356.5 440 340 440 L 170 440 C 153.5 440 140 426.5 140 410 Z" fill="#FFFFFF"/>
    
    <!-- Folded Corner -->
    <path d="M 300 90 L 300 160 L 370 160 Z" fill="#E0E7FF"/>
    
    <!-- Resume Content Lines -->
    <rect x="180" y="200" width="150" height="20" rx="10" fill="#4F46E5"/>
    <rect x="180" y="240" width="140" height="14" rx="7" fill="#9CA3AF"/>
    <rect x="180" y="268" width="110" height="14" rx="7" fill="#9CA3AF"/>
    <rect x="180" y="312" width="150" height="14" rx="7" fill="#9CA3AF"/>
    <rect x="180" y="340" width="130" height="14" rx="7" fill="#9CA3AF"/>
  </g>

  <!-- AI Sparkle Badge -->
  <path d="M 360 260 Q 360 310 410 310 Q 360 310 360 360 Q 360 310 310 310 Q 360 310 360 260 Z" fill="url(#sparkleGrad)"/>
</svg>
